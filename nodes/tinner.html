<script type="text/javascript">
RED.nodes.registerType('tinner',{
 category:'function',defaults:{
  name:{value:''},
  maxLines:{value:2000,required:true,validate:function(v){return /^\d+$/.test(String(v))&&Number(v)>=1&&Number(v)<=2000;}},
  semantic:{value:true}
 },inputs:1,outputs:1,icon:'font-awesome/fa-scissors',
 label:function(){return this.name||'tinner split';},paletteLabel:'tinner split'
});
RED.nodes.registerType('tinner-chunk',{
 category:'function',defaults:{
  name:{value:''},partId:{value:'part-0001',required:true},
  index:{value:0,required:true},source:{value:''}
 },inputs:1,outputs:1,icon:'font-awesome/fa-file-code-o',
 label:function(){return this.name||this.partId||'tinner code';},paletteLabel:'tinner code'
});
RED.nodes.registerType('tinner-join',{
 category:'function',defaults:{name:{value:''},manifest:{value:'',required:true}},
 inputs:1,outputs:1,icon:'font-awesome/fa-check-circle',
 label:function(){return this.name||'tinner verify';},paletteLabel:'tinner verify'
});
RED.nodes.registerType('tinner-project-module',{
 category:'function',
 defaults:{name:{value:''},relativePath:{value:''},kind:{value:''},sha256:{value:''},dependencyList:{value:'[]'}},
 inputs:1,outputs:1,icon:'font-awesome/fa-cubes',
 label:function(){return this.name||this.relativePath||'tinner module';},
 paletteLabel:'tinner project module'
});
RED.nodes.registerType('tinner-symbol',{
 category:'function', defaults:{
  name:{value:''},relativePath:{value:''},signature:{value:''},language:{value:''},
  lineStart:{value:0},lineEnd:{value:0},confidence:{value:''},
  ports:{value:'{"inputs":[],"outputs":[]}'}
 },inputs:1,outputs:1,icon:'font-awesome/fa-code',
 label:function(){return this.name||'tinner symbol';},paletteLabel:'tinner symbol'
});
</script>
<script type="text/html" data-template-name="tinner">
 <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
 <div class="form-row"><label for="node-input-maxLines">Max lines</label><input type="number" min="1" max="2000" id="node-input-maxLines"></div>
 <div class="form-row"><label for="node-input-semantic">JS boundaries</label><input type="checkbox" id="node-input-semantic" style="width:auto;vertical-align:middle"><span> Prefer AST boundaries</span></div>
 <p>Input: UTF-8 source string in <code>msg.payload</code>. Output: <code>msg.payload.flow</code> and manifest.</p>
</script>
<script type="text/html" data-template-name="tinner-chunk">
 <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
 <div class="form-row"><label for="node-input-partId">Part ID</label><input type="text" id="node-input-partId"></div>
 <div class="form-row"><label for="node-input-index">Index</label><input type="number" id="node-input-index" min="0"></div>
 <div class="form-row"><label for="node-input-source">Source</label><textarea id="node-input-source" rows="16" style="width:100%;font-family:monospace"></textarea></div>
 <p>Source text is stored as data, not executed.</p>
</script>
<script type="text/html" data-template-name="tinner-join">
 <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
 <div class="form-row"><label for="node-input-manifest">Manifest</label><textarea id="node-input-manifest" rows="12" style="width:100%;font-family:monospace"></textarea></div>
</script>
<script type="text/html" data-help-name="tinner"><p>Split a source text into <=2000-line code nodes and create an importable Node-RED flow.</p></script>
<script type="text/html" data-help-name="tinner-chunk"><p>Text-preserving code node; does not run arbitrary source code.</p></script>
<script type="text/html" data-help-name="tinner-join"><p>Reassembles and verifies exact source text with SHA-256.</p></script>

<script type="text/html" data-template-name="tinner-project-module">
 <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
 <div class="form-row"><label for="node-input-relativePath">Project path</label><input type="text" id="node-input-relativePath" readonly></div>
 <div class="form-row"><label for="node-input-kind">Kind</label><input type="text" id="node-input-kind" readonly></div>
 <div class="form-row"><label for="node-input-sha256">SHA-256</label><input type="text" id="node-input-sha256" readonly></div>
 <div class="form-row"><label for="node-input-dependencyList">Dependencies</label><textarea id="node-input-dependencyList" rows="7" readonly style="width:100%;font-family:monospace"></textarea></div>
</script>
<script type="text/html" data-help-name="tinner-project-module"><p>Static Godot project dependency metadata. Connection wires visualize file references, but are deliberately inert. This node never executes or forwards code.</p></script>

<script type="text/html" data-template-name="tinner-symbol">
 <div class="form-row"><label for="node-input-name">Symbol</label><input type="text" id="node-input-name" readonly></div>
 <div class="form-row"><label for="node-input-relativePath">Source path</label><input type="text" id="node-input-relativePath" readonly></div>
 <div class="form-row"><label for="node-input-signature">Signature</label><textarea rows="5" id="node-input-signature" readonly style="width:100%;font-family:monospace"></textarea></div>
 <div class="form-row"><label for="node-input-language">Language</label><input type="text" id="node-input-language" readonly></div>
 <div class="form-row"><label for="node-input-lineStart">Start line</label><input type="number" id="node-input-lineStart" readonly></div>
 <div class="form-row"><label for="node-input-lineEnd">End line</label><input type="number" id="node-input-lineEnd" readonly></div>
 <div class="form-row"><label for="node-input-confidence">Confidence</label><input type="text" id="node-input-confidence" readonly></div>
 <div class="form-row"><label for="node-input-ports">Typed ports metadata</label><textarea rows="7" id="node-input-ports" readonly style="width:100%;font-family:monospace"></textarea></div>
</script>
<script type="text/html" data-help-name="tinner-symbol"><p>Inert symbol-index node. Typed inputs/outputs are metadata, not Node-RED runtime port types. Edges are heuristic call references. This node intentionally never executes code or forwards messages.</p></script>
